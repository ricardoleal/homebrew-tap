name: Update bastionctl Formula

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest bastionctl release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(gh release view --repo ricardoleal/bastionctl --json tagName --jq '.tagName')
          VERSION="${RELEASE#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE" >> "$GITHUB_OUTPUT"

          gh release download "$RELEASE" --repo ricardoleal/bastionctl -p "checksums.txt" -O /tmp/checksums.txt
          cat /tmp/checksums.txt

          DARWIN_AMD64=$(awk '$2 ~ /(^|\/)bastionctl-darwin-amd64$/ {print $1}' /tmp/checksums.txt)
          DARWIN_ARM64=$(awk '$2 ~ /(^|\/)bastionctl-darwin-arm64$/ {print $1}' /tmp/checksums.txt)
          LINUX_AMD64=$(awk '$2 ~ /(^|\/)bastionctl-linux-amd64$/ {print $1}' /tmp/checksums.txt)
          LINUX_ARM64=$(awk '$2 ~ /(^|\/)bastionctl-linux-arm64$/ {print $1}' /tmp/checksums.txt)

          echo "darwin_amd64=$DARWIN_AMD64" >> "$GITHUB_OUTPUT"
          echo "darwin_arm64=$DARWIN_ARM64" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$LINUX_AMD64" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$LINUX_ARM64" >> "$GITHUB_OUTPUT"

      - name: Check if update needed
        id: check
        run: |
          CURRENT=$(grep 'version "' Formula/bastionctl.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')
          LATEST="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          echo "Current: $CURRENT  Latest: $LATEST  Tag: $TAG"
          # Trigger on version drift OR url/sha drift, so a past partial
          # bump (e.g. v0.1.1 hashes without URL bump) self-heals.
          if [ "$CURRENT" = "$LATEST" ] \
            && grep -q "releases/download/$TAG/" Formula/bastionctl.rb \
            && grep -q "${{ steps.release.outputs.darwin_arm64 }}" Formula/bastionctl.rb \
            && grep -q "${{ steps.release.outputs.darwin_amd64 }}" Formula/bastionctl.rb \
            && grep -q "${{ steps.release.outputs.linux_arm64 }}" Formula/bastionctl.rb \
            && grep -q "${{ steps.release.outputs.linux_amd64 }}" Formula/bastionctl.rb; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula
        if: steps.check.outputs.updated == 'true'
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          TAG="${{ steps.release.outputs.tag }}"
          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Formula/bastionctl.rb
          # Keep download URLs in sync with the release tag (this was the v0.1.1 bug:
          # version+sha were bumped but URLs still pointed at v0.1.0 binaries).
          sed -i '' "s|releases/download/v[^/]*|releases/download/$TAG|g" Formula/bastionctl.rb
          # Replace each sha256 in order: darwin-arm64, darwin-amd64, linux-arm64, linux-amd64
          # (match by surrounding url context instead: simpler to replace all four sequentially)
          perl -0pi -e 's/bastionctl-darwin-arm64"\n\s+sha256 "[a-f0-9]+"/bastionctl-darwin-arm64"\n      sha256 "${{ steps.release.outputs.darwin_arm64 }}"/' Formula/bastionctl.rb
          perl -0pi -e 's/bastionctl-darwin-amd64"\n\s+sha256 "[a-f0-9]+"/bastionctl-darwin-amd64"\n      sha256 "${{ steps.release.outputs.darwin_amd64 }}"/' Formula/bastionctl.rb
          perl -0pi -e 's/bastionctl-linux-arm64"\n\s+sha256 "[a-f0-9]+"/bastionctl-linux-arm64"\n      sha256 "${{ steps.release.outputs.linux_arm64 }}"/' Formula/bastionctl.rb
          perl -0pi -e 's/bastionctl-linux-amd64"\n\s+sha256 "[a-f0-9]+"/bastionctl-linux-amd64"\n      sha256 "${{ steps.release.outputs.linux_amd64 }}"/' Formula/bastionctl.rb
          cat Formula/bastionctl.rb

      - name: Commit and push
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bastionctl.rb
          git commit -m "Update bastionctl to v${{ steps.release.outputs.version }}"
          git push
